# Tier-0 scorer regression fixtures.
#
# Each entry has:
#   id              — short slug, used as the pytest parametrize id
#   text            — raw input message
#   lang            — "vi" or "en" (optional)
#   expect_labels   — labels that MUST be present (subset, not equality)
#   forbid_labels   — labels that MUST NOT be present (default: [])
#   min_score       — score lower bound (inclusive, optional)
#   max_score       — score upper bound (inclusive, optional)
#
# Add a fixture every time you tune the lexicons or weights — this file
# is the gold eval set we'll hand to Sprint E2 for calibration.

- id: scam_phone_and_zalo_vi
  text: "Em ơi qua zalo mình nói chuyện cho tiện nhé 0987654321"
  lang: vi
  expect_labels: [off_platform_link, phone_leak]
  min_score: 0.6

