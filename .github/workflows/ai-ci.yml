name: AI CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "ai/**"
      - ".github/workflows/ai-ci.yml"
  pull_request:
    paths:
      - "ai/**"
      - ".github/workflows/ai-ci.yml"

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Pytest
        env:
          AI_INTERNAL_TOKEN: ci-test-token
        run: pytest --cov=app --cov-report=term-missing

  build-and-push:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ai
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/datn2026-stt43-ai:latest
            ghcr.io/${{ github.repository_owner }}/datn2026-stt43-ai:sha-${{ steps.sha.outputs.short }}
          build-args: |
            IMAGE_SHA=${{ steps.sha.outputs.short }}
